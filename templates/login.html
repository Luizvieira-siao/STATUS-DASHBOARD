{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Status Dashboard</title>
  <link rel="stylesheet" href="{% static 'dashboard/styles.css' %}">
  <script src="{% static 'dashboard/login.js' %}" defer></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <div class="brand"><span class="dot"></span> STATUS-DASHBOARD</div>
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-symbol" aria-hidden="true">&#128274;</div>
      <h1 id="login-title">Bem-vindo de volta</h1>
      <p class="muted">Entre para gerenciar seus cartórios, pastas e assistentes.</p>
      <form id="form-login" method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <label for="username">Usuário</label>
        <input id="username" name="username" autocomplete="username" required autofocus maxlength="200">
        <label for="password">Senha</label>
        <div class="password-field">
          <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1000">
          <button id="toggle-password" type="button" aria-controls="password" aria-pressed="false">Mostrar</button>
        </div>
        {% if form.errors %}<p class="erro" role="alert">Usuário ou senha incorretos.</p>{% endif %}
        <button class="btn login-submit" type="submit">Entrar</button>
      </form>
      <p class="login-help muted">Acesso restrito a usuários autorizados.</p>
    </section>
  </main>
</body>
</html>
